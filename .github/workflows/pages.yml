# Monta o catálogo no _site e publica no GitHub Pages:
# galeria na raiz, demos em /classic/ e /aurora/, zips em /downloads/
# (gerados aqui pelo build — nunca versionados). O bootstrap, os templates
# e o workflow não vão para o site.
name: Deploy catalog (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "demo/**"
      - "demo-v2/**"
      - "template/**"
      - "template-v2/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Monta o _site (galeria + demos + zips)
        run: node tools/build-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
